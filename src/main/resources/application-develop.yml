spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: ${TEST_DB_URL:}
    username: ${TEST_DB_USERNAME:}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: iam-develop-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:5}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:30}
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

spring:
  application:
    name: iam-service
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:iam-service}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:30d}
